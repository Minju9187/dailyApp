spring:
  config:
    activate:
      on-profile: app_dev
  lifecycle:
    timeout-per-shutdown-phase: 1m
    main:
      allow-circular-references: true # self injection(aop proxy)을 위해 사용
    jackson:
      property-naming-strategy: SNAKE_CASE
      default-property-inclusion: NON_NULL

  server:
    port: 8081
    shutdown: graceful

  logging:
    level:
      org.hibernate.sql: debug
      org.hibernate.type: trace

  oauth2:
    client:
      provider:
        naver:
          login-url: "https://nid.naver.com/oauth2.0/authorize"
          token-url: "https://nid.naver.com/oauth2.0/token"
          me-url: "https://openapi.naver.com/v1/nid/me"
      registration:
        naver:
          client-id: ${NAVER_CLIENT_ID}
          client-secret: ${NAVER_CLIENT_SECRET}
          authorization-grant-type: authorization_code
          redirect-uri: "http://${BASE_URL}/api/auth/oauth/callback/naver"

---

