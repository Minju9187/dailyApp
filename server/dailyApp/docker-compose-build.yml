services:
  app:
    # 로컬 Dockerfile로부터 빌드
    build:
      context: .
      dockerfile: Dockerfile-api
      args:
        # 빌드할 타깃 모듈 경로 (예: apps/api, apps/batch 등)
        APP_MODULE: "api"
    image: ykh8383633/daily-api
    container_name: daily-api
    ports:
      - "8080:8080"
    environment:
      # 필요한 경우 .env도 함께 사용 가능 (env_file 참조)
      #SPRING_PROFILES_ACTIVE: "prod"
      # 컨테이너 메모리 친화 JVM 옵션 (Dockerfile의 기본값을 오버라이드 가능)
      #JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m -Xmx1024m"
      # (선택) 타임존
      TZ: "Asia/Seoul"
    # Dockerfile에 HEALTHCHECK가 있으므로 compose에서도 헬스 상태를 볼 수 있음
#    healthcheck:
#      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
#      interval: 30s
#      timeout: 5s
#      retries: 3
#      start_period: 20s
    restart: unless-stopped
    # 로그/리소스 제어 (선택)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 필요시 .env 파일도 사용
    # env_file:
    #   - ./.env
    # 볼륨이 필요하면 여기에 선언
    # volumes:
    #   - ./logs:/opt/app/logs

# 네트워크/볼륨이 필요하면 아래에 선언
# networks:
#   default:
#     name: my-app-net
